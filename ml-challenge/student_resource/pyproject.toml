[project]
name = "amazon-entity-resolution"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu==1.15.1",
    "joblib==1.5.1",
    "numpy==2.1.2",
    "pandas==2.3.2",
    "rapidfuzz==3.14.5",
    "scikit-learn==1.7.0",
    "scipy==1.15.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
